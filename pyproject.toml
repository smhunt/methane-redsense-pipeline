[project]
name = "methane-redsense-pipeline"
version = "0.3.0"
description = "MicaSense RedEdge-MX → Python radiometric calibration → WebODM pipeline for landfill methane vegetation-stress mapping (W12A site)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sean Hunt", email = "sean@ecoworks.ca" }]
keywords = ["micasense", "rededge", "webodm", "multispectral", "methane", "ndvi", "ndre"]

# Runtime dependencies.
#
# System deps not installable via pip — install separately:
#   - GDAL (for rasterio)              brew install gdal
#   - exiftool (for pyexiftool)        brew install exiftool
#   - libzbar (for pyzbar)             brew install zbar
#
# MicaSense radiometric model: installed directly from the official
# reference repo, pinned to a SHA for reproducibility (it is not
# published to PyPI). Bump the SHA deliberately, not casually.
#   Upstream: https://github.com/micasense/imageprocessing
dependencies = [
    # Imagery I/O
    "numpy>=1.26",
    "rasterio>=1.3",
    # MicaSense radiometric calibration (pinned to master @ 2026-05-22).
    # Pulls in opencv-python, matplotlib, pysolar transitively.
    # NOTE: install requires GIT_LFS_SKIP_SMUDGE=1 — the repo has orphaned
    # LFS pointers for tutorial sample data the Python module doesn't need.
    "micasense @ git+https://github.com/micasense/imageprocessing.git@3a903861b2f38c1717a5b6d918a2d9196db507ae",
    # Supporting image processing
    # (opencv-python comes transitively from micasense, don't list separately)
    "scikit-image>=0.22",
    "pyzbar>=0.1.9",  # also needs DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib at import time on macOS arm64
    # EXIF preservation through the pipeline
    "pyexiftool>=0.5",
    # WebODM API client
    "pyodm>=1.5",
    # Config / ODM presets
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/smhunt/methane-redsense-pipeline"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `src` is the importable top-level package (per CLAUDE.md the
# entry points are invoked as `python -m src.calibration.run` etc.).
# This is an unusual layout but matches the convention this repo
# committed to up-front.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Ruff ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["B011"]                   # allow `assert False` in tests
"notebooks/**" = ["E402", "F401"]        # notebooks are scratch

# ── Pytest ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["src"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
